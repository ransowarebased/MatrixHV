[package]
name = "matrixhv-sdk"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "MatrixHV instrumentation ABI and Rust client API"

[lib]
path = "src/lib.rs"

[[example]]
name = "l2_memory_probe"
path = "../tests/l2_memory_probe.rs"
required-features = ["client"]

[features]
default = ["client"]
client = []
update = ["dep:ed25519-dalek", "dep:sha2"]

[dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false, optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }

[target.'cfg(target_os = "uefi")'.dependencies]
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"], optional = true }

[[test]]
name = "client"
path = "../tests/client_tests.rs"
required-features = ["client"]

[[test]]
name = "update"
path = "../tests/update_tests.rs"
required-features = ["update"]

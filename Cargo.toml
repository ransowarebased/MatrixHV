[package]
name = "matrixhv"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "MatrixHV"
path = "src/main.rs"

[dependencies]
log = { version = "0.4.28", default-features = false }
uefi = { version = "0.40.0", features = ["alloc", "global_allocator", "panic_handler"] }
uefi-raw = "0.16.0"
ed25519-dalek = { version = "2.2.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
yaxpeax-x86 = { version = "2.2.0", default-features = false }
yaxpeax-arch = { version = "0.3.2", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[package]
name = "neo"
version = "1.0.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "neo"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:serde", "dep:serde_json", "dep:colored", "dep:ed25519-dalek", "dep:sha2", "dep:shlex", "dep:windows-sys", "dep:libc"]

[[test]]
name = "cli"
path = "../../tests/neo_cli_tests.rs"
required-features = ["cli"]

[[test]]
name = "library"
path = "../../tests/neo_library_tests.rs"

[[test]]
name = "analysis"
path = "../../tests/neo_analysis_tests.rs"

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
pdb = "0.8.0"
yaxpeax-x86 = { version = "2.2.0", default-features = false, features = ["std", "fmt"] }
yaxpeax-arch = { version = "0.3.2", default-features = false, features = ["std"] }
colored = { version = "2.1", optional = true }
ed25519-dalek = { version = "2.2.0", default-features = false, optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
ureq = "2.12.1"
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
shlex = { version = "1.3", optional = true }
libc = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
